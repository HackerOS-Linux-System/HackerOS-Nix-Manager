[package]
name = "hnm"
version = "0.2.0"
edition = "2021"
# hk-parser (config.hk support) pulls in clap 4.6.x, whose newest patch
# releases require edition2024 manifests — so building `hnm` needs a
# reasonably current toolchain even though our own code stays edition2021.
rust-version = "1.85"
authors = ["HackerOS Team <hackeros068@gmail.com>"]
description = "HackerOS Nix Manager — lightweight Nix package manager for HackerOS"
license = "Apache-2.0"

[[bin]]
name = "hnm"
path = "src/main.rs"

[dependencies]
lexopt       = "0.3"
owo-colors   = { version = "4", features = ["supports-colors"] }
indicatif    = "0.17"
serde        = { version = "1", features = ["derive"] }
serde_json   = "1"
anyhow       = "1"
chrono       = { version = "0.4", features = ["serde"] }
dirs         = "5"
libc         = "0.2"

# .hk config format (replaces the old TOML config, see docs/hnm.html#config)
# https://crates.io/crates/hk-parser · https://hackeros-linux-system.github.io/HackerOS-Website/tools-docs/hk.html
hk-parser    = "0.3.1"
indexmap     = "2"
